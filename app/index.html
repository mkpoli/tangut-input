  <script>
    // The colour scheme is a design-system choice. `?palette=` previews one without a rebuild and
    // without changing the reader's next visit; the design page keeps its own pick.
    try {
      const known = ['paper', 'mineral', 'indigo', 'sand']
      const asked = new URLSearchParams(location.search).get('palette')
      const kept = localStorage.getItem('tangut-input:scheme')
      const palette = known.includes(asked) ? asked : known.includes(kept) ? kept : 'paper'
      document.documentElement.dataset.palette = palette
    } catch {}
  </script>
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebSite","name":"Tangut Input","url":"https://tangut.mkpo.li/",

     "inLanguage":"en","potentialAction":{"@type":"SearchAction","target":"https://tangut.mkpo.li/?q={search_term_string}","query-input":"required name=search_term_string"}}
  </script>
