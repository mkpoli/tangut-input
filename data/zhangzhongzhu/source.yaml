  transcription: one Chinese character per Tangut character
  images: 5766 × 4978 px per canvas at full size
notes:
  - The 掌中珠 is a classified glossary of about a thousand entries, in nine sections (天, 地, 人 …).
  - The images are CC BY-NC 4.0, 清光山西巖寺 / 国文学研究資料館. They are fetched to cache/ and not redistributed with the site.
  - The keyed text is our own work over a public-domain work; the non-commercial term governs the images, not the rows. Its licence is not settled, so cite the canvas and this repository.
  - The copy prints the Tangut as well as the Chinese: canvas 4 is the title page, canvas 5 the series title facing a Tangut preface.
  - A reading of a damaged glyph needs a second witness before it is called certain; see comparisons.

