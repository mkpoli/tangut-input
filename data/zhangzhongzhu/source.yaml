# 番漢合時掌中珠, the 1190 Tangut–Chinese glossary, in the copy digitised by the
# National Institute of Japanese Literature. This record is the source; the
# witness record in witnesses.tsv is the physical copy, because the same text
# survives in more than one printing and the transcription must say which one
# it was keyed from.
#
# The scan is a Republican-era 貽安堂 print, not the Khara-Khoto manuscript.
# Its Chinese transcription column is what makes the text worth keying: one
# Chinese character per Tangut character, which no other source gives.

