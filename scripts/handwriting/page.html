<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tangut handwriting quiz</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tangut&display=swap">
<style>
  :root{
    color-scheme:light dark;
    --bg:light-dark(#faf8f3,#151412);--surface:light-dark(#fff,#1e1d1a);--surface-2:light-dark(#f3f0e9,#26241f);
    --ink:light-dark(#1c1a16,#f0ece2);--ink-2:light-dark(#55524a,#b7b1a3);--line:light-dark(#e2ddd1,#3a3730);
    --accent:light-dark(#b23a2b,#e07a68);--tangut:"Noto Serif Tangut",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100dvh}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.01em}
  header p{margin:0;color:var(--ink-2);font-size:13px}
  header .bar{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
  .writer{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
  .writer input{width:150px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
  main{max-width:960px;margin:0 auto;padding:24px 20px 80px}
  .prompt{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
  /* The prompt and the pad keep their boxes whatever is loading, so nothing moves between prompts. */
  .glyph{font-family:var(--tangut);font-size:150px;line-height:1;border:1px solid var(--line);border-radius:18px;background:var(--surface);
    padding:18px;width:272px;height:272px;display:grid;place-items:center;text-align:center;flex:none}
  .glyph img{display:block;width:224px;height:224px;object-fit:contain;filter:invert(var(--invert,0))}
  .glyph.loading{color:var(--line)}
  .glyph.multi{display:flex;gap:6px;font-size:96px;padding:18px 14px}
  .glyph .opt{border:1px solid transparent;border-radius:12px;padding:0 6px}
  .glyph .opt:hover,.glyph .opt:focus{border-color:var(--accent);outline:none}
  .glyph .opt.chosen{border-color:var(--accent);background:var(--surface-2)}
  .preview{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .side{flex:1;min-width:260px}
  .side p{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
  .pad-wrap{position:relative;width:340px;max-width:100%}
  canvas{display:block;width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair;border-radius:16px;background:var(--surface);
    box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  .status{margin-top:10px;color:var(--ink-2);font-size:13px;height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .done{text-align:center;padding-top:60px}
  .done h2{font-family:var(--tangut);font-size:13px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
  @media (prefers-color-scheme:dark){.glyph img,.glyph .opt img{filter:invert(1)}}
  .hint{color:var(--ink-2);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Tangut handwriting quiz</h1>
  <p>Draw the character; your strokes are saved with the answer on the server.</p>
  <label class="writer">Writer <input id="writer" placeholder="a name or initials" autocomplete="off" spellcheck="false" /></label>
  <span class="bar" id="bar"></span>
</header>
<main>
  <div class="prompt">
    <div class="glyph" id="glyph" aria-live="polite">…</div>
    <div class="side">
      <p id="instruction">Loading…</p>
      <div class="pad-wrap"><canvas id="pad" width="680" height="680" aria-label="Drawing pad"></canvas></div>
      <div class="actions">
        <button class="primary" id="done" disabled>Done</button>
        <button id="undo">Undo stroke</button>
        <button id="clear">Clear</button>
        <button id="skip">Skip</button>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>
</main>
<script type="module">
  const pad = document.getElementById('pad')
  const glyph = document.getElementById('glyph')
  const instruction = document.getElementById('instruction')
  const status = document.getElementById('status')
  const done = document.getElementById('done')
  const bar = document.getElementById('bar')
  const context = pad.getContext('2d')

  let item = null
  let chosen = null
  // Who is drawing, kept in this browser: a recognizer is judged on writers it has not seen.
  let writer = localStorage.getItem('tangut-quiz:writer') ?? ''
  // Each point's time and pressure, per stroke, for a recognizer that reads the pen's path.
  let times = []
  let pressure = []
  let pointer = ''
  let strokes = []
  let current = null
  let first = null
  let live = true
  // The number of the prompt on screen; the server's index for a prefetched one can be stale.
  let shown = 0

  function paint() {
    const ratio = pad.width / pad.clientWidth
    context.setTransform(1, 0, 0, 1, 0, 0)
    context.clearRect(0, 0, pad.width, pad.height)
    const ink = getComputedStyle(pad).color
    context.strokeStyle = ink
    context.lineCap = 'round'
    context.lineJoin = 'round'
    context.lineWidth = 9 * ratio
    for (const stroke of [...strokes, ...(current ? [current] : [])]) {
      context.beginPath()
      stroke.forEach(([x, y], i) => i ? context.lineTo(x * ratio, y * ratio) : context.moveTo(x * ratio, y * ratio))
      if (stroke.length === 1) context.lineTo(stroke[0][0] * ratio + 0.1, stroke[0][1] * ratio)
      context.stroke()
    }
    done.disabled = !strokes.length
  }

  function point(event) {
    const box = pad.getBoundingClientRect()
    return [event.clientX - box.left, event.clientY - box.top]
  }
  pad.addEventListener('pointerdown', event => {
    if (!item) return
    pad.setPointerCapture(event.pointerId)
    first = event.pointerId
    pointer = event.pointerType || 'mouse'
    current = [point(event)]
    times = [...times, [Math.round(event.timeStamp)]]
    pressure = [...pressure, [event.pressure ?? 0]]
    live = true
    strokes = [...strokes, current]
    paint()
  })
  pad.addEventListener('pointermove', event => {
    if (event.pointerId !== first || !current) return
    // Coalesced events carry the pen's full sample rate, which a recognizer wants.
    const samples = event.getCoalescedEvents?.() ?? [event]
    for (const sample of samples) {
      current.push(point(sample))
      times.at(-1).push(Math.round(sample.timeStamp))
      pressure.at(-1).push(sample.pressure ?? 0)
    }
    strokes = [...strokes.slice(0, -1), current]
    paint()
  })
  const end = event => {
    if (event.pointerId !== first) return
    current = null
    first = null
    paint()
  }
  pad.addEventListener('pointerup', end)
  pad.addEventListener('pointercancel', end)

  let captured = ''
  const OUTBOX = 'tangut-quiz:captures'
  const queued = () => { try { return JSON.parse(localStorage.getItem(OUTBOX) || '[]') } catch { return [] } }
  let sending = false
  async function flushCaptures() {
    if (sending) return
    sending = true
    try {
      while (queued().length) {
        const body = queued()[0]
        const response = await fetch('/api/capture', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), keepalive: true })
        if (!response.ok) {
          if (response.status !== 400) break
          // A previous session's prompt remains available for recovery without blocking this round.
          const unresolved = JSON.parse(localStorage.getItem(`${OUTBOX}:unresolved`) || '[]')
          localStorage.setItem(`${OUTBOX}:unresolved`, JSON.stringify([...unresolved, body]))
        }
        localStorage.setItem(OUTBOX, JSON.stringify(queued().filter(entry => entry.captureId !== body.captureId)))
      }
    } catch {} finally { sending = false }
  }
  addEventListener('online', flushCaptures)
  void flushCaptures()
  function capture() {
    if (!item || !strokes.length) return
    const width = pad.clientWidth, height = pad.clientHeight
    const body = { prompt: item.prompt, strokes: strokes.map(stroke => stroke.map(([x, y]) => [+(x / width).toFixed(4), +(y / height).toFixed(4)])), times, pressure, pointer, writer: writer || null, width, height }
    const key = JSON.stringify(body)
    if (key === captured) return
    try {
      localStorage.setItem(OUTBOX, JSON.stringify([...queued(), { ...body, captureId: crypto.randomUUID() }]))
      captured = key
      void flushCaptures()
    } catch {
      // A blocked store still gets a best-effort keepalive send.
      void fetch('/api/capture', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...body, captureId: crypto.randomUUID() }), keepalive: true }).catch(() => {})
    }
  }
  function leave() {
    current = null
    first = null
    capture()
  }
  addEventListener('beforeunload', leave)
  addEventListener('pagehide', leave)
  document.addEventListener('visibilitychange', () => { if (document.hidden) leave() })

  document.getElementById('undo').onclick = () => {
    if (!strokes.length) return
    capture()
    current = null; first = null
    strokes = strokes.slice(0, -1); times = times.slice(0, -1); pressure = pressure.slice(0, -1); paint()
  }
  document.getElementById('clear').onclick = () => {
    capture()
    if (first !== null && pad.hasPointerCapture(first)) pad.releasePointerCapture(first)
    current = null
    first = null
    strokes = []
    times = []
    pressure = []
    paint()
  }

  /** A prompt as the page shows it: the image to copy, and one line of instruction. */
  function show(body) {
    item = body
    bar.textContent = `${++shown} / ${body.total}`
    // The box is the same size for every prompt and shows the image only once it is decoded.
    glyph.classList.remove('multi', 'loading')
    const picture = document.createElement('img')
    picture.src = drawable(body.image)
    picture.alt = 'The character to draw'
    picture.decoding = 'sync'
    glyph.replaceChildren(picture)
    chosen = body.kind
    instruction.textContent = body.kind === 'lookalike'
      ? 'This character has several lookalikes. Draw this one in the square below.'
      : body.kind === 'component'
        ? 'Draw this component on its own, as large as it fits.'
        : 'Draw this whole character in the square below, as large as it fits.'
    paint()
  }

  /** @param {string} path */
  const drawable = path => path ? `/glyph-${path.split('glyph-').pop()}` : ''

  // The prompt after the current one, fetched while the current one is being drawn, so pressing
  // Done shows it at once instead of waiting for a round trip and an image.
  /** @type {{ body: any, images: HTMLImageElement[] } | null} */
  let ahead = null
  async function prefetch() {
    if (!item || ahead) return
    const response = await fetch('/api/peek').catch(() => null)
    if (!response?.ok) return
    const body = await response.json()
    if (body.done) return
    const images = [body.image, ...(body.options ?? []).map(option => option.image)].filter(Boolean).map(path => {
      const img = new Image()
      img.src = drawable(path)
      img.decode?.().catch(() => {})
      return img
    })
    ahead = { body, images }
    void images.length
  }

  async function next() {
    current = null
    first = null
    strokes = []
    times = []
    pressure = []
    chosen = null
    item = null
    paint()
    if (ahead) {
      // The next prompt was fetched while drawing; take it and ask the server to confirm it is the
      // one it will save against, so a stale prefetch can never shift the answers by a prompt.
      const { body } = ahead
      ahead = null
      instruction.textContent = ''
      // The server still holds this prompt; the page asks for it as the current one.
      fetch('/api/claim', { method: 'POST' }).catch(() => {})
      show(body)
      prefetch()
      return
    }
    glyph.className = 'glyph loading'
    glyph.textContent = '…'
    instruction.textContent = 'Loading the next character…'
    status.textContent = ''
    const response = await fetch('/api/next')
    const body = await response.json()
    if (body.done) {
      bar.textContent = ''
      glyph.className = 'glyph'
      glyph.textContent = '✓'
      instruction.textContent = 'That is the whole round. Thank you; every drawing is saved on the server.'
      pad.style.display = 'none'
      document.querySelector('.actions').style.display = 'none'
      return
    }
    instruction.textContent = ''
    show(body)
    prefetch()
  }

  done.onclick = async () => {
    const width = pad.clientWidth, height = pad.clientHeight
    status.textContent = 'Saving…'
    const response = await fetch('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        strokes: strokes.map(stroke => stroke.map(([x, y]) => [+(x / width).toFixed(4), +(y / height).toFixed(4)])),
        times, pressure, pointer, writer: writer || null,
        device: `${navigator.platform ?? ''} ${navigator.userAgent.match(/(Chrome|Firefox|Safari|Edge)\/[\d.]+/)?.[0] ?? ''}`.trim(),
        width, height,
      }),
    })
    const body = await response.json().catch(() => ({}))
    if (!response.ok || !body.saved) {
      // Nothing was written; the drawing stays on the pad to try again.
      status.textContent = `Not saved: ${body.error ?? response.status}. Press Done again.`
      return
    }
    captured = JSON.stringify({ prompt: item.prompt, strokes: strokes.map(stroke => stroke.map(([x, y]) => [+(x / width).toFixed(4), +(y / height).toFixed(4)])), times, pressure, pointer, writer: writer || null, width, height })
    status.textContent = `Saved as ${body.saved}.`
    await next()
  }
  document.getElementById('skip').onclick = async () => { capture(); await fetch('/api/skip', { method: 'POST' }); next() }

  const writerField = document.getElementById('writer')
  writerField.value = writer
  writerField.oninput = () => { writer = writerField.value.trim(); localStorage.setItem('tangut-quiz:writer', writer) }

  next()
</script>
</body>
</html>
